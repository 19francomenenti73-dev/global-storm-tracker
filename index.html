<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Storm Tracker - Continenti | Nowcasting Italia</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #map { width: 100%; height: 100%; background: #0f172a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    /* Controllo Selezione Continente */
    .continent-selector {
      position: absolute;
      top: 12px;
      left: 50px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 12px;
      border-radius: 8px;
    }
    .continent-selector select {
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #334155;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    /* Banner Contatore Celle */
    .cells-counter-banner {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(244, 63, 94, 0.5);
      padding: 6px 12px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .counter-label { font-size: 11px; color: #94a3b8; font-weight: 600; }
    .counter-number { font-size: 15px; font-weight: 800; color: #f43f5e; background: rgba(244, 63, 94, 0.15); padding: 2px 8px; border-radius: 6px; }

    /* Info Status */
    .tracker-status {
      position: absolute;
      bottom: 20px;
      left: 12px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
    }

    /* Animazione Cerchietto Pulsante sui Nuclei Convettivi */
    .storm-pulse-marker {
      width: 18px;
      height: 18px;
      background: rgba(244, 63, 94, 0.45);
      border: 2px solid #f43f5e;
      border-radius: 50%;
      box-shadow: 0 0 10px #f43f5e;
      animation: cellPulse 1.2s infinite ease-in-out;
    }

    @keyframes cellPulse {
      0% { transform: scale(0.8); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.4; }
      100% { transform: scale(0.8); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="continent-selector">
    <select id="regionSelect" onchange="changeRegion()">
      <option value="europa">🇪🇺 Europa</option>
      <option value="nord_america">🇺🇸 Nord America</option>
      <option value="sud_america">🇧🇷 Sud America</option>
      <option value="asia">🇯🇵 Asia & Oceania</option>
      <option value="africa">🌍 Africa</option>
    </select>
  </div>

  <div class="cells-counter-banner">
    <span class="counter-label">CELLE ≥32 dBZ</span>
    <span class="counter-number" id="cell-count">0</span>
  </div>

  <div class="tracker-status" id="status-display">
    Sincronizzazione Radar...
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Configurazione Coordinate e Zoom per Settori Continentali
    const regions = {
      europa: { center: [48.0, 10.0], zoom: 5 },
      nord_america: { center: [38.0, -97.0], zoom: 4 },
      sud_america: { center: [-15.0, -60.0], zoom: 4 },
      asia: { center: [25.0, 115.0], zoom: 4 },
      africa: { center: [2.0, 20.0], zoom: 4 }
    };

    const map = L.map('map', {
      center: regions.europa.center,
      zoom: regions.europa.zoom,
      worldCopyJump: true
    });

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Esri &mdash; RainViewer / Nowcasting Italia',
      maxZoom: 16
    }).addTo(map);

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 16
    }).addTo(map);

    let radarLayer = null;
    let markersGroup = L.layerGroup().addTo(map);
    let currentRadarPath = "";

    // Cambio Continente dal Menu a Tendina
    function changeRegion() {
      const selected = document.getElementById('regionSelect').value;
      const target = regions[selected];
      map.flyTo(target.center, target.zoom, { duration: 1.2 });
    }

    // Caricamento Dati Radar
    async function updateRadar() {
      try {
        const response = await fetch('https://api.rainviewer.com/public/weather-maps.json');
        const data = await response.json();

        if (!data || !data.radar || !data.radar.past) return;

        const lastFrame = data.radar.past[data.radar.past.length - 1];
        currentRadarPath = lastFrame.path;

        if (radarLayer) map.removeLayer(radarLayer);
        
        radarLayer = L.tileLayer(`https://tilecache.rainviewer.com${currentRadarPath}/256/{z}/{x}/{y}/2/1_1.png`, {
          opacity: 0.7,
          tileSize: 256,
          maxZoom: 18
        }).addTo(map);

        const timeString = new Date(lastFrame.time * 1000).toLocaleString('it-IT');
        document.getElementById('status-display').innerHTML = `<b>Radar Live:</b> ${timeString}`;

        processCells();

      } catch (e) {
        console.error("Errore sincro radar:", e);
      }
    }

    // Algoritmo di Posizionamento Cerchietti sui Centroidi della Vista Attiva
    function processCells() {
      markersGroup.clearLayers();
      if (!currentRadarPath) return;

      const bounds = map.getBounds();
      const zoom = Math.min(Math.max(map.getZoom(), 3), 7);
      
      const nw = map.project(bounds.getNorthWest(), zoom).divideBy(256).floor();
      const se = map.project(bounds.getSouthEast(), zoom).divideBy(256).floor();

      let detectedCount = 0;
      const points = [];

      // Scansione mattonelle visibili nel riquadro continentale
      for (let x = nw.x; x <= se.x; x++) {
        for (let y = nw.y; y <= se.y; y++) {
          
          const img = new Image();
          img.crossOrigin = "anonymous";
          img.src = `https://tilecache.rainviewer.com${currentRadarPath}/256/${zoom}/${x}/${y}/2/1_1.png`;

          img.onload = function() {
            const cvs = document.createElement('canvas');
            cvs.width = 256;
            cvs.height = 256;
            const ctx = cvs.getContext('2d');
            ctx.drawImage(img, 0, 0);

            try {
              const data = ctx.getImageData(0, 0, 256, 256).data;

              // Passo di scansione 12px
              for (let px = 0; px < 256; px += 12) {
                for (let py = 0; py < 256; py += 12) {
                  const idx = (py * 256 + px) * 4;
                  const r = data[idx];
                  const g = data[idx + 1];
                  const b = data[idx + 2];
                  const a = data[idx + 3];

                  if (a < 80) continue; // Salta aree prive di precipitazione

                  // Filtro cromatico rigoroso per riflettività ≥32 dBZ (Giallo, Arancio, Rosso, Magenta)
                  const isYellow = (r > 210 && g > 180 && b < 90);
                  const isOrange = (r > 220 && g >= 100 && g <= 175 && b < 70);
                  const isRedPurple = (r > 190 && g < 90);

                  if (isYellow || isOrange || isRedPurple) {
                    const gx = x * 256 + px;
                    const gy = y * 256 + py;
                    const latLng = map.unproject([gx, gy], zoom);

                    // Distanza minima tra cerchietti (30 km) per evitare sovrapposizioni
                    const tooClose = points.some(p => map.distance(p, latLng) < 30000);

                    if (!tooClose) {
                      points.push(latLng);
                      detectedCount++;

                      const icon = L.divIcon({
                        className: 'storm-pulse-marker',
                        iconSize: [18, 18],
                        iconAnchor: [9, 9]
                      });

                      const marker = L.marker(latLng, { icon: icon });
                      marker.bindPopup(`<b>Cella Convettiva Rilevata</b><br>Riflettività: ≥32 dBZ<br>Lat: ${latLng.lat.toFixed(2)} | Lon: ${latLng.lng.toFixed(2)}`);
                      markersGroup.addLayer(marker);

                      document.getElementById('cell-count').innerText = detectedCount;
                    }
                  }
                }
              }
            } catch(e) {}
          };
        }
      }
    }

    map.on('moveend', processCells);
    updateRadar();
    setInterval(updateRadar, 300000); // Aggiornamento automatico ogni 5 minuti
  </script>
</body>
</html>
