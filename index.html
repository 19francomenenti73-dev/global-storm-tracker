<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Storm Tracker - Pixel Scan (≥32 dBZ) | Nowcasting Italia</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #map { width: 100%; height: 100%; background: #0f172a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    .tracker-header {
      position: absolute;
      top: 12px;
      left: 50px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 14px;
      border-radius: 8px;
    }
    .tracker-header h1 { font-size: 15px; font-weight: 700; color: #38bdf8; margin: 0; }
    .tracker-header p { font-size: 11px; color: #94a3b8; margin: 0; }

    .cells-counter-banner {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(244, 63, 94, 0.5);
      padding: 8px 14px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .counter-label { font-size: 11px; color: #94a3b8; font-weight: 600; }
    .counter-number { font-size: 16px; font-weight: 800; color: #f43f5e; background: rgba(244, 63, 94, 0.15); padding: 2px 8px; border-radius: 6px; }

    .tracker-controls {
      position: absolute;
      bottom: 20px;
      left: 12px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 11px;
    }

    /* Cerchietto Pulsante per Celle ≥32 dBZ */
    .storm-cell-pulse {
      width: 18px;
      height: 18px;
      background: rgba(244, 63, 94, 0.4);
      border: 2px solid #f43f5e;
      border-radius: 50%;
      box-shadow: 0 0 10px #f43f5e;
      animation: cellPulse 1.3s infinite ease-in-out;
    }

    @keyframes cellPulse {
      0% { transform: scale(0.85); opacity: 1; }
      50% { transform: scale(1.25); opacity: 0.5; }
      100% { transform: scale(0.85); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="tracker-header">
    <h1>Global Storm Tracker</h1>
    <p>Scansione Pixel Radar ≥ 32 dBZ | Nowcasting Italia</p>
  </div>

  <div class="cells-counter-banner">
    <span class="counter-label">CELLE ATTIVE</span>
    <span class="counter-number" id="cell-count">0</span>
  </div>

  <div class="tracker-controls" id="status-display">
    Scansione pixel in corso...
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const map = L.map('map', {
      center: [42.5, 12.5],
      zoom: 4,
      worldCopyJump: true
    });

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Esri &mdash; Radar Scan / Nowcasting Italia',
      maxZoom: 16
    }).addTo(map);

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 16
    }).addTo(map);

    let radarLayer = null;
    let stormMarkersGroup = L.layerGroup().addTo(map);

    async function scanRadarPixels() {
      try {
        const response = await fetch('https://api.rainviewer.com/public/weather-maps.json');
        const data = await response.json();

        if (!data || !data.radar || !data.radar.past || data.radar.past.length === 0) return;

        const lastFrame = data.radar.past[data.radar.past.length - 1];
        
        if (radarLayer) map.removeLayer(radarLayer);
        radarLayer = L.tileLayer(`https://tilecache.rainviewer.com${lastFrame.path}/256/{z}/{x}/{y}/2/1_1.png`, {
          opacity: 0.65,
          tileSize: 256,
          maxZoom: 18,
          crossOrigin: true
        }).addTo(map);

        const timeString = new Date(lastFrame.time * 1000).toLocaleString('it-IT');
        document.getElementById('status-display').innerHTML = `<b>Scansione Radar:</b> ${timeString}`;

        processVisibleTiles(lastFrame.path);

      } catch (e) {
        console.error("Errore scansione radar:", e);
      }
    }

    function processVisibleTiles(radarPath) {
      stormMarkersGroup.clearLayers();
      
      const bounds = map.getBounds();
      const zoom = Math.min(map.getZoom(), 6);
      
      const northWest = map.project(bounds.getNorthWest(), zoom).divideBy(256).floor();
      const southEast = map.project(bounds.getSouthEast(), zoom).divideBy(256).floor();

      let detectedCells = 0;
      const detectedPoints = [];

      for (let x = northWest.x; x <= southEast.x; x++) {
        for (let y = northWest.y; y <= southEast.y; y++) {
          const img = new Image();
          img.crossOrigin = "Anonymous";
          img.src = `https://tilecache.rainviewer.com${radarPath}/256/${zoom}/${x}/${y}/2/1_1.png`;

          img.onload = function() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);

            try {
              const imgData = ctx.getImageData(0, 0, 256, 256).data;
              
              // Scansione pixel a passo 12px per catturare anche celle piccole
              for (let px = 0; px < 256; px += 12) {
                for (let py = 0; py < 256; py += 12) {
                  const idx = (py * 256 + px) * 4;
                  const r = imgData[idx];
                  const g = imgData[idx + 1];
                  const b = imgData[idx + 2];
                  const alpha = imgData[idx + 3];

                  // SOGLIA ≥ 32 dBZ: prende sia i gialli/arancio (R elevato, G medio) che i rossi/magenta
                  const isThreshold32dBZ = (alpha > 80) && (
                    (r > 190 && g > 130 && b < 100) || // Giallo/Arancio (~32-40 dBZ)
                    (r > 180 && g < 120)               // Rosso/Magenta (>40 dBZ)
                  );

                  if (isThreshold32dBZ) {
                    const pointX = x * 256 + px;
                    const pointY = y * 256 + py;
                    const latLng = map.unproject([pointX, pointY], zoom);

                    // Raggruppamento centroidi entro 35 km
                    const isDuplicate = detectedPoints.some(pt => map.distance(pt, latLng) < 35000);

                    if (!isDuplicate) {
                      detectedPoints.push(latLng);
                      detectedCells++;

                      const customIcon = L.divIcon({
                        className: 'storm-cell-pulse',
                        iconSize: [18, 18],
                        iconAnchor: [9, 9]
                      });

                      const marker = L.marker(latLng, { icon: customIcon });
                      marker.bindPopup(`<b>Cella Convettiva Rilevata</b><br>Riflettività: ≥32 dBZ<br>Lat: ${latLng.lat.toFixed(2)} | Lon: ${latLng.lng.toFixed(2)}`);
                      stormMarkersGroup.addLayer(marker);

                      document.getElementById('cell-count').innerText = detectedCells;
                    }
                  }
                }
              }
            } catch(err) {}
          };
        }
      }
    }

    map.on('moveend', scanRadarPixels);
    scanRadarPixels();
    setInterval(scanRadarPixels, 300000);
  </script>
</body>
</html>
