<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Storm Tracker - Nowcasting Italia</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #map { width: 100%; height: 100%; background: #0f172a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    .tabs-bar {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      gap: 4px;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 4px;
      border-radius: 8px;
    }
    .tab-btn {
      background: transparent;
      color: #94a3b8;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn:hover { color: #fff; background: rgba(255, 255, 255, 0.05); }
    .tab-btn.active { background: #38bdf8; color: #0f172a; font-weight: 700; }

    .cells-counter-banner {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(244, 63, 94, 0.5);
      padding: 6px 12px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .counter-label { font-size: 11px; color: #94a3b8; font-weight: 600; }
    .counter-number { font-size: 15px; font-weight: 800; color: #f43f5e; background: rgba(244, 63, 94, 0.15); padding: 2px 8px; border-radius: 6px; }

    .tracker-status {
      position: absolute;
      bottom: 20px;
      left: 12px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
    }

    @keyframes pulseSVG {
      0% { r: 5px; fill-opacity: 0.9; stroke-width: 1.5; }
      50% { r: 9px; fill-opacity: 0.4; stroke-width: 3; }
      100% { r: 5px; fill-opacity: 0.9; stroke-width: 1.5; }
    }
    .storm-pulse {
      animation: pulseSVG 1.2s infinite ease-in-out;
    }
  </style>
</head>
<body>

  <div class="tabs-bar">
    <button class="tab-btn active" onclick="selectContinent('europa', this)">🇪🇺 Europa</button>
    <button class="tab-btn" onclick="selectContinent('nord_america', this)">🇺🇸 N. America</button>
    <button class="tab-btn" onclick="selectContinent('sud_america', this)">🇧🇷 S. America</button>
    <button class="tab-btn" onclick="selectContinent('asia', this)">🇯🇵 Asia/Oceania</button>
    <button class="tab-btn" onclick="selectContinent('africa', this)">🌍 Africa</button>
  </div>

  <div class="cells-counter-banner">
    <span class="counter-label">CELLE ≥32 dBZ</span>
    <span class="counter-number" id="cell-count">0</span>
  </div>

  <div class="tracker-status" id="status-display">
    Sincronizzazione Radar...
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const continents = {
      europa: { center: [48.0, 5.0], zoom: 5 },
      nord_america: { center: [40.0, -98.0], zoom: 4 },
      sud_america: { center: [-15.0, -60.0], zoom: 4 },
      asia: { center: [25.0, 100.0], zoom: 4 },
      africa: { center: [2.0, 20.0], zoom: 4 }
    };

    const map = L.map('map', {
      center: continents.europa.center,
      zoom: continents.europa.zoom,
      worldCopyJump: true
    });

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Esri &mdash; RainViewer / Nowcasting Italia',
      maxZoom: 16
    }).addTo(map);

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 16
    }).addTo(map);

    let radarLayer = null;
    let stormGroup = L.layerGroup().addTo(map);
    let currentPath = "";

    function selectContinent(key, btnElement) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btnElement.classList.add('active');

      const target = continents[key];
      map.flyTo(target.center, target.zoom, { duration: 1.0 });
    }

    async function updateRadar() {
      try {
        const response = await fetch('https://api.rainviewer.com/public/weather-maps.json');
        const data = await response.json();

        if (!data || !data.radar || !data.radar.past) return;

        const lastFrame = data.radar.past[data.radar.past.length - 1];
        currentPath = lastFrame.path;

        if (radarLayer) map.removeLayer(radarLayer);
        
        radarLayer = L.tileLayer(`https://tilecache.rainviewer.com${currentPath}/256/{z}/{x}/{y}/2/1_1.png`, {
          opacity: 0.7,
          tileSize: 256,
          maxZoom: 18
        }).addTo(map);

        const timeString = new Date(lastFrame.time * 1000).toLocaleString('it-IT');
        document.getElementById('status-display').innerHTML = `<b>Radar Live:</b> ${timeString}`;

        scanVisibleTiles();

      } catch (e) {
        console.error("Errore sync radar:", e);
      }
    }

    function scanVisibleTiles() {
      stormGroup.clearLayers();
      if (!currentPath) return;

      const currentZoom = Math.min(Math.max(map.getZoom(), 3), 7); 
      const bounds = map.getBounds();

      const nwPoint = map.project(bounds.getNorthWest(), currentZoom);
      const sePoint = map.project(bounds.getSouthEast(), currentZoom);

      const minX = Math.floor(nwPoint.x / 256);
      const maxX = Math.floor(sePoint.x / 256);
      const minY = Math.floor(nwPoint.y / 256);
      const maxY = Math.floor(sePoint.y / 256);

      let totalCells = 0;

      for (let x = minX; x <= maxX; x++) {
        for (let y = minY; y <= maxY; y++) {
          
          const tileImg = new Image();
          tileImg.crossOrigin = "anonymous";
          
          // Chiamata diretta CDN RainViewer abilitata CORS
          tileImg.src = `https://tilecache.rainviewer.com${currentPath}/256/${currentZoom}/${x}/${y}/2/1_1.png`;

          tileImg.onload = function() {
            try {
              const canvas = document.createElement('canvas');
              canvas.width = 256;
              canvas.height = 256;
              const ctx = canvas.getContext('2d', { willReadFrequently: true });
              ctx.drawImage(tileImg, 0, 0);

              const imgData = ctx.getImageData(0, 0, 256, 256).data;
              const step = currentZoom < 5 ? 12 : 6;

              for (let px = 0; px < 256; px += step) {
                for (let py = 0; py < 256; py += step) {
                  const i = (py * 256 + px) * 4;
                  const r = imgData[i];
                  const g = imgData[i + 1];
                  const b = imgData[i + 2];
                  const a = imgData[i + 3];

                  // Filtro cromatico per le intensità elevate (giallo/arancio/rosso/viola)
                  if (a > 80 && (r > 160 && (g < 210 || b < 100))) {
                    
                    const globalX = x * 256 + px;
                    const globalY = y * 256 + py;
                    const latLng = map.unproject(L.point(globalX, globalY), currentZoom);

                    totalCells++;

                    const circle = L.circleMarker(latLng, {
                      radius: 5,
                      color: '#ffffff',
                      weight: 1.2,
                      fillColor: '#f43f5e',
                      fillOpacity: 0.9,
                      className: 'storm-pulse'
                    });

                    circle.bindPopup(`<b>Nucleo Convettivo</b><br>Riflettività: ≥32 dBZ<br>Lat: ${latLng.lat.toFixed(2)} | Lon: ${latLng.lng.toFixed(2)}`);
                    stormGroup.addLayer(circle);

                    document.getElementById('cell-count').innerText = totalCells;
                  }
                }
              }
            } catch (err) {
              // Isolamento dell'errore: se una tile va in blocco non interrompe le altre
            }
          };

          // Gestione esplicita dell'errore di caricamento per evitare che il ciclo si blocchi
          tileImg.onerror = function() {};
        }
      }
    }

    map.on('moveend', scanVisibleTiles);

    updateRadar();
    setInterval(updateRadar, 300000);
  </script>
</body>
</html>
