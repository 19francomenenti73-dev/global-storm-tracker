<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Storm Tracker Continentale - Nowcasting Italia</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #map { width: 100%; height: 100%; background: #0f172a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    .tabs-bar {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      gap: 4px;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 4px;
      border-radius: 8px;
    }
    .tab-btn {
      background: transparent;
      color: #94a3b8;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn:hover { color: #fff; background: rgba(255, 255, 255, 0.05); }
    .tab-btn.active { background: #38bdf8; color: #0f172a; font-weight: 700; }

    .cells-counter-banner {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(244, 63, 94, 0.5);
      padding: 6px 12px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .counter-label { font-size: 11px; color: #94a3b8; font-weight: 600; }
    .counter-number { font-size: 15px; font-weight: 800; color: #f43f5e; background: rgba(244, 63, 94, 0.15); padding: 2px 8px; border-radius: 6px; }

    .tracker-status {
      position: absolute;
      bottom: 20px;
      left: 12px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
    }

    /* Cerchio pulsante ad alto contrasto visibile su sfondo scuro/radar */
    @keyframes pulseCircle {
      0% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.4); opacity: 0.4; }
      100% { transform: scale(1); opacity: 0.9; }
    }
    .storm-pulse-node {
      width: 14px;
      height: 14px;
      background: #f43f5e;
      border: 2px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 8px #f43f5e;
      animation: pulseCircle 1s infinite ease-in-out;
    }
  </style>
</head>
<body>

  <div class="tabs-bar">
    <button class="tab-btn active" onclick="selectContinent('europa', this)">🇪🇺 Europa</button>
    <button class="tab-btn" onclick="selectContinent('nord_america', this)">🇺🇸 N. America</button>
    <button class="tab-btn" onclick="selectContinent('sud_america', this)">🇧🇷 S. America</button>
    <button class="tab-btn" onclick="selectContinent('asia', this)">🇯🇵 Asia/Oceania</button>
    <button class="tab-btn" onclick="selectContinent('africa', this)">🌍 Africa</button>
  </div>

  <div class="cells-counter-banner">
    <span class="counter-label">CELLE ≥32 dBZ</span>
    <span class="counter-number" id="cell-count">0</span>
  </div>

  <div class="tracker-status" id="status-display">
    Sincronizzazione Radar...
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const continents = {
      europa: { center: [48.0, 5.0], zoom: 5 },
      nord_america: { center: [40.0, -98.0], zoom: 4 },
      sud_america: { center: [-15.0, -60.0], zoom: 4 },
      asia: { center: [25.0, 100.0], zoom: 4 },
      africa: { center: [2.0, 20.0], zoom: 4 }
    };

    let activeContinentKey = 'europa';
    const map = L.map('map', {
      center: continents.europa.center,
      zoom: continents.europa.zoom,
      worldCopyJump: true
    });

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Esri &mdash; RainViewer / Nowcasting Italia',
      maxZoom: 16
    }).addTo(map);

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 16
    }).addTo(map);

    let radarLayer = null;
    let markersGroup = L.layerGroup().addTo(map);
    let currentRadarPath = "";

    function selectContinent(key, btnElement) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btnElement.classList.add('active');

      activeContinentKey = key;
      const target = continents[key];
      map.flyTo(target.center, target.zoom, { duration: 1.0 });

      setTimeout(scanPixelRadar, 1200);
    }

    async function updateRadar() {
      try {
        const response = await fetch('https://api.rainviewer.com/public/weather-maps.json');
        const data = await response.json();

        if (!data || !data.radar || !data.radar.past) return;

        const lastFrame = data.radar.past[data.radar.past.length - 1];
        currentRadarPath = lastFrame.path;

        if (radarLayer) map.removeLayer(radarLayer);
        
        radarLayer = L.tileLayer(`https://tilecache.rainviewer.com${currentRadarPath}/256/{z}/{x}/{y}/2/1_1.png`, {
          opacity: 0.7,
          tileSize: 256,
          maxZoom: 18
        }).addTo(map);

        const timeString = new Date(lastFrame.time * 1000).toLocaleString('it-IT');
        document.getElementById('status-display').innerHTML = `<b>Radar Live:</b> ${timeString}`;

        scanPixelRadar();

      } catch (e) {
        console.error("Errore sincro radar:", e);
      }
    }

    function scanPixelRadar() {
      markersGroup.clearLayers();
      if (!currentRadarPath) return;

      const bounds = map.getBounds();
      // Zoom di scansione fisso a 5 per far combaciare esattamente Pixel e Lat/Lon
      const scanZoom = 5;

      const nwPoint = map.project(bounds.getNorthWest(), scanZoom);
      const sePoint = map.project(bounds.getSouthEast(), scanZoom);

      const minTileX = Math.floor(nwPoint.x / 256);
      const maxTileX = Math.floor(sePoint.x / 256);
      const minTileY = Math.floor(nwPoint.y / 256);
      const maxTileY = Math.floor(sePoint.y / 256);

      let totalCells = 0;
      const points = [];

      for (let x = minTileX; x <= maxTileX; x++) {
        for (let y = minTileY; y <= maxTileY; y++) {
          
          const tileUrl = `https://tilecache.rainviewer.com${currentRadarPath}/256/${scanZoom}/${x}/${y}/2/1_1.png`;
          const proxiedUrl = `https://corsproxy.io/?${encodeURIComponent(tileUrl)}`;

          const img = new Image();
          img.crossOrigin = "anonymous";
          img.src = proxiedUrl;

          img.onload = function() {
            const cvs = document.createElement('canvas');
            cvs.width = 256;
            cvs.height = 256;
            const ctx = cvs.getContext('2d');
            ctx.drawImage(img, 0, 0);

            try {
              const pixelData = ctx.getImageData(0, 0, 256, 256).data;

              for (let px = 0; px < 256; px += 10) {
                for (let py = 0; py < 256; py += 10) {
                  const idx = (py * 256 + px) * 4;
                  const r = pixelData[idx];
                  const g = pixelData[idx + 1];
                  const b = pixelData[idx + 2];
                  const a = pixelData[idx + 3];

                  if (a < 60) continue;

                  // Filtro cromatico rigido per dBZ >= 32
                  const isYellow = (r > 200 && g > 165 && b < 100);
                  const isOrange = (r > 210 && g >= 85 && g <= 165 && b < 80);
                  const isRedPurple = (r > 175 && g < 85);

                  if (isYellow || isOrange || isRedPurple) {
                    const globalX = x * 256 + px;
                    const globalY = y * 256 + py;
                    
                    // Conversione diretta da Coordinate Globali Pixel a Lat/Lon Leaflet
                    const latLng = map.unproject([globalX, globalY], scanZoom);

                    const tooClose = points.some(p => map.distance(p, latLng) < 20000);

                    if (!tooClose) {
                      points.push(latLng);
                      totalCells++;

                      const pulseIcon = L.divIcon({
                        className: 'storm-pulse-node',
                        iconSize: [14, 14],
                        iconAnchor: [7, 7]
                      });

                      const marker = L.marker(latLng, { icon: pulseIcon });
                      marker.bindPopup(`<b>Nucleo Convettivo</b><br>Riflettività: ≥32 dBZ<br>Lat: ${latLng.lat.toFixed(2)} | Lon: ${latLng.lng.toFixed(2)}`);
                      markersGroup.addLayer(marker);

                      document.getElementById('cell-count').innerText = totalCells;
                    }
                  }
                }
              }
            } catch(e) {}
          };
        }
      }
    }

    map.on('moveend', scanPixelRadar);
    updateRadar();
    setInterval(updateRadar, 300000);
  </script>
</body>
</html>
