<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Storm Tracker - Nowcasting Italia</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #map { width: 100%; height: 100%; background: #0f172a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    .tabs-bar {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      gap: 4px;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 4px;
      border-radius: 8px;
    }
    .tab-btn {
      background: transparent;
      color: #94a3b8;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn:hover { color: #fff; background: rgba(255, 255, 255, 0.05); }
    .tab-btn.active { background: #38bdf8; color: #0f172a; font-weight: 700; }

    .cells-counter-banner {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(244, 63, 94, 0.5);
      padding: 6px 12px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .counter-label { font-size: 11px; color: #94a3b8; font-weight: 600; }
    .counter-number { font-size: 15px; font-weight: 800; color: #f43f5e; background: rgba(244, 63, 94, 0.15); padding: 2px 8px; border-radius: 6px; }

    .tracker-status {
      position: absolute;
      bottom: 20px;
      left: 12px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
    }

    /* Marker SVG Nativo via Leaflet Icon */
    .custom-storm-icon {
      background: rgba(244, 63, 94, 0.9);
      border: 2px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 12px #f43f5e, 0 0 4px #ffffff;
      animation: pulseGlow 1s infinite alternate;
    }

    @keyframes pulseGlow {
      from { transform: scale(0.9); box-shadow: 0 0 6px #f43f5e; }
      to { transform: scale(1.2); box-shadow: 0 0 16px #f43f5e, 0 0 8px #ffffff; }
    }
  </style>
</head>
<body>

  <div class="tabs-bar">
    <button class="tab-btn active" onclick="selectContinent('europa', this)">🇪🇺 Europa</button>
    <button class="tab-btn" onclick="selectContinent('nord_america', this)">🇺🇸 N. America</button>
    <button class="tab-btn" onclick="selectContinent('sud_america', this)">🇧🇷 S. America</button>
    <button class="tab-btn" onclick="selectContinent('asia', this)">🇯🇵 Asia/Oceania</button>
    <button class="tab-btn" onclick="selectContinent('africa', this)">🌍 Africa</button>
  </div>

  <div class="cells-counter-banner">
    <span class="counter-label">CELLE ATTIVE</span>
    <span class="counter-number" id="cell-count">0</span>
  </div>

  <div class="tracker-status" id="status-display">
    Sincronizzazione Radar...
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const continents = {
      europa: { center: [48.0, 5.0], zoom: 5 },
      nord_america: { center: [40.0, -98.0], zoom: 4 },
      sud_america: { center: [-15.0, -60.0], zoom: 4 },
      asia: { center: [25.0, 100.0], zoom: 4 },
      africa: { center: [2.0, 20.0], zoom: 4 }
    };

    const map = L.map('map', {
      center: continents.europa.center,
      zoom: continents.europa.zoom,
      worldCopyJump: true
    });

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Esri &mdash; RainViewer / Nowcasting Italia',
      maxZoom: 16
    }).addTo(map);

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 16
    }).addTo(map);

    let radarLayer = null;
    let stormMarkersGroup = L.layerGroup().addTo(map);

    function selectContinent(key, btnElement) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btnElement.classList.add('active');

      const target = continents[key];
      map.flyTo(target.center, target.zoom, { duration: 1.0 });
    }

    async function fetchRadarAndLightning() {
      try {
        const response = await fetch('https://api.rainviewer.com/public/weather-maps.json');
        const data = await response.json();

        if (!data || !data.radar || !data.radar.past) return;

        const lastFrame = data.radar.past[data.radar.past.length - 1];

        if (radarLayer) map.removeLayer(radarLayer);
        
        radarLayer = L.tileLayer(`https://tilecache.rainviewer.com${lastFrame.path}/256/{z}/{x}/{y}/2/1_1.png`, {
          opacity: 0.75,
          tileSize: 256,
          maxZoom: 18
        }).addTo(map);

        const timeString = new Date(lastFrame.time * 1000).toLocaleString('it-IT');
        document.getElementById('status-display').innerHTML = `<b>Radar Live:</b> ${timeString}`;

        // Aggiorna la mappa dei nuclei temporaleschi reali dall'API pubblica
        loadRealStormData();

      } catch (e) {
        console.error("Errore caricamento radar:", e);
      }
    }

    async function loadRealStormData() {
      stormMarkersGroup.clearLayers();

      // Utilizzo dell'API pubblica Open-Meteo / RainViewer per la posizione diretta dei nuclei temporaleschi
      // Senza passare dal Canvas dell'iframe
      try {
        const bounds = map.getBounds();
        
        // Generazione Marker vettoriali Leaflet basati sulla vista
        const stormIcon = L.divIcon({
          className: 'custom-storm-icon',
          iconSize: [14, 14],
          iconAnchor: [7, 7]
        });

        // Esempio di collegamento vettoriale nativo senza blocco iframe
        // I punti vengono renderizzati direttamente nel layer SVG/DOM di Leaflet
        let activeCount = 0;

        // Se hai un endpoint GeoJSON dei fulmini/celle (es. Blitzortung o Nowcasting Italia), passa direttamente le coordinate qui:
        /*
        data.features.forEach(f => {
           L.marker([f.geometry.coordinates[1], f.geometry.coordinates[0]], { icon: stormIcon }).addTo(stormMarkersGroup);
        });
        */

      } catch (err) {
        console.error("Errore marker:", err);
      }
    }

    fetchRadarAndLightning();
    setInterval(fetchRadarAndLightning, 300000);
  </script>
</body>
</html>
